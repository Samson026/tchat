[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
protocol = { path = "../crates/protocol" }
sqlx = { version = "0.9.0", features = ["chrono", "runtime-tokio", "sqlite"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread"] }
