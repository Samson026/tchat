[package]
name = "tchat"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.33"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = "0.30.0"


[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "client"
path = "src/bin/client.rs"
